name: Docker Build and Publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build & Push Laravel App
      - name: Build and push Laravel App
        uses: docker/build-push-action@v5
        with:
          context: ./web_portal
          file: ./web_portal/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-app:latest

      # 2. Build & Push Nginx Web
      - name: Build and push Nginx Web
        uses: docker/build-push-action@v5
        with:
          context: ./web_portal
          file: ./web_portal/nginx.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:latest

      # 3. Build & Push AI OCR Mobile
      - name: Build and push AI OCR Mobile
        uses: docker/build-push-action@v5
        with:
          context: ./ai_services/ocr_mobile
          file: ./ai_services/ocr_mobile/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ai-ocr-mobile:latest

      # 4. Build & Push AI OCR SPBU
      - name: Build and push AI OCR SPBU
        uses: docker/build-push-action@v5
        with:
          context: ./ai_services/ocr_spbu
          file: ./ai_services/ocr_spbu/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ai-ocr-spbu:latest
