<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPBU CCTV Command Center</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            width: 100%;
            background-color: var(--card-bg);
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        header h1 {
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }
        .container {
            width: 90%;
            max-width: 800px;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .upload-section {
            border: 2px dashed var(--text-muted);
            border-radius: 8px;
            padding: 40px 20px;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }
        .upload-section:hover {
            border-color: var(--primary);
            background-color: rgba(59, 130, 246, 0.05);
        }
        input[type="file"] {
            display: none;
        }
        .custom-file-upload {
            background-color: var(--primary);
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: background-color 0.3s;
            display: inline-block;
            margin-bottom: 15px;
        }
        .custom-file-upload:hover {
            background-color: var(--primary-hover);
        }
        button[type="submit"] {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            margin-left: 10px;
            transition: background-color 0.3s;
        }
        button[type="submit"]:hover {
            background-color: #059669;
        }
        #file-name {
            display: block;
            margin-top: 10px;
            color: var(--text-muted);
        }
        .result-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #334155;
        }
        .result-image {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 2px solid #334155;
        }
        .loading {
            display: none;
            margin-top: 20px;
            color: var(--primary);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>SPBU CCTV COMMAND CENTER ⛽</h1>
    </header>

    <div class="container">
        <p style="color: var(--text-muted); margin-bottom: 30px;">
            Upload gambar atau video motor (CCTV/Top View) untuk dianalisis oleh AI.
        </p>

        <form action="/" method="POST" enctype="multipart/form-data" id="upload-form">
            <div class="upload-section">
                <label for="file-upload" class="custom-file-upload">
                    📁 Pilih Gambar/Video
                </label>
                <input id="file-upload" type="file" name="file" accept="image/*,video/*" onchange="updateFileName()"/>
                
                <button type="submit" onclick="showLoading()">🚀 Proses AI</button>
                <span id="file-name">Belum ada file yang dipilih</span>
                <div class="loading" id="loading-msg">Menganalisis gambar... ⏳</div>
            </div>
        </form>

        {% if result_image %}
        <div class="result-section">
            <h2 style="margin-top:0; color: #10b981;">✅ Hasil Deteksi:</h2>
            <img src="{{ url_for('serve_result', filename=result_image) }}" alt="Hasil Deteksi" class="result-image">
        </div>
        {% endif %}
        
        {% if result_video %}
        <div class="result-section">
            <h2 style="margin-top:0; color: #10b981;">✅ Hasil Deteksi (Video):</h2>
            <video width="100%" controls class="result-image" autoplay loop muted>
                <source src="{{ url_for('serve_result', filename=result_video) }}" type="video/webm">
                Browser Anda tidak mendukung HTML video.
            </video>
        </div>
        {% endif %}
    </div>

    <script>
        function updateFileName() {
            var input = document.getElementById('file-upload');
            var fileName = input.files[0] ? input.files[0].name : 'Belum ada file yang dipilih';
            document.getElementById('file-name').textContent = fileName;
        }

        function showLoading() {
            var input = document.getElementById('file-upload');
            if(input.files.length > 0) {
                document.getElementById('loading-msg').style.display = 'block';
            }
        }
    </script>
</body>
</html>
